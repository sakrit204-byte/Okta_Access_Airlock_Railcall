name: ci

# Five gates, because passing one says nothing about the others. Two of these
# were added after a gate we already had let a real defect through: the listing
# gate accepted a manifest the station could not load, and the station loaded a
# handler the listing gate rejected.
#
#   offline suite   behaviour, against recorded responses
#   station_check   the bundle actually loads and runs inside RailCall
#   check_parity    manifest, handler, listing and README all agree
#   lint_listing    the marketplace will accept the module
#   check_workflow  the marketplace will accept the workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the only runtime dependency
        run: python -m pip install --quiet cryptography

      - name: Offline contract suite
        run: python -m unittest discover -s tests -v

      - name: Station loading contract
        run: python tools/station_check.py

      - name: Manifest and description parity
        run: python tools/check_parity.py

      - name: Marketplace publish gate, module
        run: python tools/lint_listing.py

      - name: Marketplace publish gate, workflow
        run: python tools/check_workflow.py
